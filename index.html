<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Sudoku</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Tiny Sudoku ✿</h1>
        <p class="tag">Fill every row, column and box with 1-9.</p>
      </header>

      <div class="levels" role="group" aria-label="Difficulty">
        <button type="button" data-level="easy" aria-pressed="true">
          Easy
        </button>
        <button type="button" data-level="Medium" aria-pressed="true">
          Medium
        </button>
        <button type="button" data-level="Hard" aria-pressed="true">
          Hard
        </button>
      </div>

      <div class="bar">
        <div class="hearts" id="hearts" aria-label="Lives left">💗💗💗</div>
        <div id="timer" aria-label="Time">0:00</div>
      </div>

      <div id="grid" role="grid" aria-label="Sudoku board"></div>

      <div id="pad" aria-label="Number pad"></div>

      <div class="actions">
        <button type="button" id="erase">Erase</button>
        <button type="button" id="pencil" aria-pressed="false">Pencil</button>
        <button type="button" id="hint">Hint</button>
        <button type="button" id="new" class="primary">New game</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
